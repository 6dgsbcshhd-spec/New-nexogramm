<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexogram</title>
<style>
:root{--bg:#07111d;--panel:#0b1a2b;--panel2:#10263b;--line:#23405c;--blue:#45a8ff;--muted:#91a8bd;--gold:#ffd15a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111d,#0b2034);color:#f5f8fb;font:15px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.card{background:#0b1a2bf5;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 25px 70px #0009}.auth .card{width:min(460px,100%)}h1{text-align:center}.blue{color:var(--blue)}.input{width:100%;padding:13px;margin:6px 0;background:#071522;color:#fff;border:1px solid #294661;border-radius:13px}.btn{padding:12px 16px;border:0;border-radius:13px;background:#2586cf;color:#fff;font-weight:800}.secondary{background:#162d43}.wide{width:100%}.err{color:#ff788b;min-height:20px;font-size:13px}.muted{color:var(--muted);font-size:13px}
.app{display:none;min-height:100vh}.top{height:62px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#081522ee;position:sticky;top:0;z-index:20}.top b{font-size:21px;flex:1}.icon{width:42px;height:42px;border:1px solid #284862;background:#0d2237;color:#fff;border-radius:12px}
.layout{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 62px)}.side{border-right:1px solid var(--line);background:#081421;overflow:auto}.search{padding:12px}.nav{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line)}.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:10px}.nav .active{background:#12324e;color:#fff}.user{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #142b40}.user:hover{background:#0d2237}.ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2e77ad,#162c44);display:grid;place-items:center;overflow:hidden;flex:none;font-weight:900}.ava img{width:100%;height:100%;object-fit:cover}.user main{flex:1;min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{padding:2px 7px;border-radius:99px;background:#173b59;color:#80cbff;font-size:10px;font-weight:800}
.chat{display:flex;flex-direction:column;height:calc(100vh - 62px);background:radial-gradient(circle at 80% 0,#0e2a44,#07111d 55%)}.chathead{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:#091827dd}.chathead main{flex:1}.messages{flex:1;overflow:auto;padding:18px}.bubble{max-width:min(72%,560px);padding:10px 13px;background:#12263a;border-radius:16px;margin:7px 0}.mine{margin-left:auto;background:#21689f}.time{font-size:10px;color:#a0b5c8;text-align:right;margin-top:4px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#081522dd}.composer .input{margin:0;flex:1;border-radius:20px}.voice{width:48px;border:0;border-radius:50%;background:#173754;color:#8dd2ff}.voice.recording{background:#8e2e46;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.panel{padding:18px;overflow:auto}.section{background:#0b1b2c;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.gift{background:#0a1725;border:1px solid #304963;border-radius:16px;padding:10px;transition:.2s}.gift:hover{transform:translateY(-3px);border-color:#55b4ff}.gift img{width:100%;border-radius:11px;aspect-ratio:1;object-fit:cover}.coin{color:var(--gold);font-weight:900}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:50}.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto}.profile{display:flex;gap:15px;align-items:center}.bigava{width:88px;height:88px;border-radius:50%;background:#173654;overflow:hidden;display:grid;place-items:center;font-size:28px}.file{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#153650;border:1px solid #2d5a7d;padding:13px 16px;border-radius:13px;z-index:100}.bottom{display:none}
@media(max-width:800px){.layout{display:block}.side{height:calc(100vh - 120px);border:0}.chat{position:fixed;inset:62px 0 58px;z-index:30}.bottom{position:fixed;bottom:0;left:0;right:0;height:58px;background:#081522;border-top:1px solid var(--line);display:flex;z-index:40}.bottom button{flex:1;border:0;background:transparent;color:var(--muted)}.bottom button.active{color:#fff}.top .logout{display:none}.panel{padding:12px}}
</style></head><body>
<div id="auth" class="auth"><div class="card">
<h1>✦ <span class="blue">Nexo</span>gram</h1>
<div id="reg">
<input id="rPhone" class="input" placeholder="Номер телефона, +...">
<input id="rUser" class="input" placeholder="Юзернейм без @">
<input id="rPass" class="input" type="password" placeholder="Пароль (минимум 8 символов)">
<input id="rPass2" class="input" type="password" placeholder="Повторите пароль">
<div id="rErr" class="err"></div><button class="btn wide" onclick="register()">Зарегистрироваться</button>
<p class="muted">После регистрации username сохраняется на сервере и позволяет найти аккаунт с другого устройства.</p>
<hr><button class="btn secondary wide" onclick="showLogin()">Войти</button>
</div>
<div id="login" class="hidden">
<input id="lPhone" class="input" placeholder="Номер телефона, +...">
<div id="adminHint" class="hidden"><input id="lPass" class="input" type="password" placeholder="Пароль администратора"></div>
<div id="userPassWrap"><input id="lUserPass" class="input" type="password" placeholder="Пароль"></div>
<div id="lErr" class="err"></div><button class="btn wide" onclick="login()">Войти</button>
<p id="loginHint" class="muted">Введите номер телефона и пароль. Для служебного номера администратора автоматически появится отдельное поле пароля.</p>
<button class="btn secondary wide" style="margin-top:8px" onclick="showReg()">Назад</button>
</div>
</div></div>

<div id="app" class="app"><div class="top"><b>✦ <span class="blue">Nexo</span>gram</b><span id="me"></span><button class="icon" onclick="profile(me)">◉</button><button class="btn secondary logout" onclick="logout()">Выйти</button></div>
<div class="layout"><aside id="side" class="side">
<div class="search"><input id="search" class="input" placeholder="Поиск @username" oninput="searchUsers()"></div>
<div class="nav"><button class="active" onclick="nav('chats',this)">Чаты</button><button onclick="nav('gifts',this)">Подарки</button><button onclick="nav('shop',this)">Магазин</button></div>
<div id="sideContent"><h3 style="padding:0 13px">Пользователи</h3><div id="contacts"></div><div id="results"></div></div></aside>
<main id="chat" class="chat hidden"><div class="chathead"><button class="icon" onclick="closeChat()">‹</button><div id="chatAva" class="ava">N</div><main><b id="chatName">Чат</b><div id="chatTag" class="muted"></div></main><button class="icon" onclick="profile(current,true)">ⓘ</button></div><div id="messages" class="messages"></div>
<div class="composer"><input id="msg" class="input" placeholder="Сообщение" onkeydown="if(event.key==='Enter')send()"><button id="voice" class="voice" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()">●</button><button class="btn" onclick="send()">➤</button></div></main>
<section id="content" class="panel hidden"></section></div>
<div class="bottom"><button onclick="navMobile('chats',this)">◉<br>Чаты</button><button onclick="navMobile('gifts',this)">✦<br>Подарки</button><button onclick="navMobile('shop',this)">◈<br>Магазин</button><button onclick="profile(me)">●<br>Профиль</button></div></div>
<div id="modal" class="modal hidden"><div id="modalBody" class="card"></div></div><div id="toast" class="toast hidden"></div>
<script>
const API=(location.protocol==='file:'?'http://localhost:3000':location.origin);let token=localStorage.getItem('nexo_token'),me=null,current=null,ws=null,rec=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showReg(){$('reg').classList.remove('hidden');$('login').classList.add('hidden')}function showLogin(){$('reg').classList.add('hidden');$('login').classList.remove('hidden');$('lErr').textContent='';$('lPhone').focus()}
$('lPhone').addEventListener('input',()=>{let p=$('lPhone').value.trim(),admin=p.replace(/[\s()-]/g,'')==='+88800000000';$('adminHint').classList.toggle('hidden',!admin);$('userPassWrap').classList.toggle('hidden',admin);$('loginHint').textContent=admin?'Введите пароль администратора.':'Введите номер телефона и пароль.'});
async function api(path,opt={}){let r;try{r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});}catch(e){throw Error('Не удалось связаться с сервером Nexogram. Запустите backend командой npm start и откройте http://localhost:3000')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Ошибка сервера (${r.status})`);return d}
async function register(){try{let phone=$('rPhone').value.trim(),username=$('rUser').value.trim().replace(/^@/,''),p=$('rPass').value,p2=$('rPass2').value;if(!phone||!username||p.length<8||p!==p2)throw Error('Заполните телефон, username и два одинаковых пароля (8+ символов).');let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({phone,username,password:p,passwordConfirm:p2})});token=d.token;localStorage.setItem('nexo_token',token);await boot()}catch(e){$('rErr').textContent=e.message}}
async function login(){try{let phone=$('lPhone').value.trim(),admin=phone.replace(/[\s()-]/g,'')==='+88800000000',password=admin?$('lPass').value:$('lUserPass').value;if(!phone||!password)throw Error('Введите номер телефона и пароль.');let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone,password})});token=d.token;localStorage.setItem('nexo_token',token);await boot()}catch(e){$('lErr').textContent=e.message}}
async function boot(){try{let d=await api('/api/me');me=d.user;$('auth').style.display='none';$('app').style.display='block';$('me').innerHTML=esc('@'+me.username)+(me.premium?' <span class="badge">✦ PREMIUM</span>':'');connectWS();loadContacts()}catch(e){localStorage.removeItem('nexo_token');token=null;showLogin()}}
function connectWS(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/?token='+encodeURIComponent(token));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='message'&&current&&m.message.chatId===chatId(me.id,current.id))appendMessage(m.message)}}
function chatId(a,b){return [a,b].sort().join(':')}
async function loadContacts(){let d=await api('/api/users');$('contacts').innerHTML=d.users.filter(u=>u.id!==me.id).map(row).join('')}
function row(u){return `<div class="user" onclick="openChat('${u.id}')"><div class="ava">${u.avatar?`<img src="${esc(u.avatar)}">`:esc(u.username[0].toUpperCase())}</div><main><b>${esc(u.username)}</b><div class="muted">@${esc(u.username)}</div>${u.premium?'<span class="badge">✦ PREMIUM</span>':''}</main><span>›</span></div>`}
async function searchUsers(){let q=$('search').value.trim();if(!q){$('results').innerHTML='';return}let d=await api('/api/users?q='+encodeURIComponent(q));$('results').innerHTML=d.users.filter(u=>u.id!==me.id).map(row).join('')}
async function openChat(id){let d=await api('/api/users/'+id);current=d.user;$('side').classList.add('hide');$('chat').classList.remove('hidden');$('content').classList.add('hidden');$('chatName').textContent=current.username;$('chatTag').textContent='@'+current.username;$('chatAva').innerHTML=current.avatar?`<img src="${esc(current.avatar)}">`:esc(current.username[0].toUpperCase());let x=await api('/api/chats/'+current.id+'/messages');$('messages').innerHTML='';x.messages.forEach(appendMessage)}
function appendMessage(m){if(m.chatId!==chatId(me.id,current?.id))return;let el=document.createElement('div');el.className='bubble '+(m.senderId===me.id?'mine':'');if(m.type==='voice')el.innerHTML=`◉ Голосовое<audio controls src="${esc(m.url)}"></audio><div class="time">${esc(m.time)}</div>`;else if(m.type==='gift')el.innerHTML=`<div style="font-size:42px">✦</div><b>Подарок: ${esc(m.giftName)}</b><div class="muted">${esc(m.time)}</div>`;else el.innerHTML=`${esc(m.text)}<div class="time">${esc(m.time)}</div>`;$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight}
async function send(){let t=$('msg').value.trim();if(!t||!current)return;await api('/api/messages',{method:'POST',body:JSON.stringify({to:current.id,text:t})});$('msg').value=''}
function startVoice(){if(rec||!navigator.mediaDevices||!current)return;navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{rec=new MediaRecorder(stream);let chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{let blob=new Blob(chunks,{type:'audio/webm'}),fd=new FormData();fd.append('file',blob,'voice.webm');fd.append('to',current.id);let r=await fetch(API+'/api/media/voice',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});let d=await r.json();if(!r.ok)return toast(d.error||'Ошибка');stream.getTracks().forEach(t=>t.stop())};rec.start();$('voice').classList.add('recording')}).catch(()=>toast('Разрешите микрофон'))}
function stopVoice(){if(rec){rec.stop();rec=null;$('voice').classList.remove('recording')}}
function closeChat(){$('chat').classList.add('hidden');$('side').classList.remove('hide');current=null}
function navMobile(x,b){nav(x,b);document.querySelectorAll('.bottom button').forEach(q=>q.classList.remove('active'));b.classList.add('active')}
function nav(x,b){document.querySelectorAll('.nav button').forEach(q=>q.classList.remove('active'));if(b)b.classList.add('active');$('chat').classList.add('hidden');$('content').classList.remove('hidden');if(x==='chats'){$('content').classList.add('hidden');$('side').classList.remove('hide');loadContacts()}if(x==='gifts')giftsPage();if(x==='shop')shopPage()}
async function giftsPage(){let d=await api('/api/gifts');$('content').innerHTML=`<div class="section"><h2>✦ Подарки</h2><p class="muted">Анимированные фирменные карточки Nexogram.</p><div class="grid">${d.gifts.map(g=>`<div class="gift"><img src="${esc(g.image)}"><b>${esc(g.name)}</b><p class="coin">★ ${g.price.toLocaleString('ru-RU')} NC</p><button class="btn wide" onclick="gift('${g.id}')">Подарить</button></div>`).join('')}</div></div>`}
async function gift(id){if(!current){toast('Сначала откройте чат');return}try{await api('/api/gifts/'+id+'/send',{method:'POST',body:JSON.stringify({to:current.id})});toast('Подарок отправлен');closeChat();openChat(current.id)}catch(e){toast(e.message)}}
async function shopPage(){let d=await api('/api/shop');$('content').innerHTML=`<div class="section"><h2>◈ Nexo Coin</h2><p>Баланс: <span class="coin">${d.coins.toLocaleString('ru-RU')} NC</span></p><div class="grid">${d.packs.map(p=>`<div class="gift"><h3>${esc(p.name)}</h3><b class="coin">${p.coins.toLocaleString('ru-RU')} NC</b><p class="muted">Демо-покупка</p><button class="btn wide" onclick="buyCoins(${p.coins})">Купить</button></div>`).join('')}</div></div><div class="section"><h2>✦ Premium</h2><p class="muted">Серверная подписка с Premium-значком и расширенными возможностями.</p></div><div class="section"><h2>Создать</h2><button class="btn" onclick="createCommunity('group')">Создать группу</button> <button class="btn secondary" onclick="createCommunity('channel')">Создать канал</button></div>`}
async function buyCoins(n){await api('/api/shop/coins',{method:'POST',body:JSON.stringify({coins:n})});toast('Nexo Coin начислены');shopPage()}
async function createCommunity(type){let name=prompt(type==='group'?'Название группы':'Название канала');if(!name)return;try{await api('/api/communities',{method:'POST',body:JSON.stringify({type,name})});toast('Создано');}catch(e){toast(e.message)}}
async function profile(u,fromChat=false){let d=await api('/api/users/'+u.id),x=d.user;let gifts=d.gifts||[];$('modal').classList.remove('hidden');$('modalBody').innerHTML=`<div class="profile"><div class="bigava">${x.avatar?`<img src="${esc(x.avatar)}">`:esc(x.username[0].toUpperCase())}</div><div><h2>@${esc(x.username)}</h2>${x.premium?'<span class="badge">✦ PREMIUM</span>':''}<p class="muted">Нажмите, чтобы скопировать username</p><button class="btn secondary" onclick="navigator.clipboard.writeText('@${esc(x.username)}');toast('Username скопирован')">Копировать @username</button></div></div>${u.id===me.id?`<p class="coin">★ ${me.coins.toLocaleString('ru-RU')} NC</p>`:''}<hr><h3>Подарки</h3>${gifts.length?gifts.map(g=>`<div class="gift"><img src="${esc(g.image)}"><b>${esc(g.name)}</b><div class="muted">Подарил: @${esc(g.from)} • ${esc(g.time)}</div>${x.id===me.id?`<button class="btn secondary wide" onclick="sellGift('${g.id}')">Продать за ${g.sellPrice.toLocaleString('ru-RU')} NC</button>`:''}</div>`).join(''):'<p class="muted">Подарков пока нет.</p>'}${fromChat?`<button class="btn wide" style="margin-top:10px" onclick="closeModal()">Вернуться в чат</button>`:''}<button class="btn secondary wide" style="margin-top:8px" onclick="closeModal()">Закрыть</button>`}
async function sellGift(id){try{await api('/api/gifts/'+id+'/sell',{method:'POST'});toast('Подарок продан за 60%');closeModal();profile(me)}catch(e){toast(e.message)}}
function closeModal(){$('modal').classList.add('hidden')}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}function logout(){localStorage.removeItem('nexo_token');location.reload()}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};window.addEventListener('load',()=>{if(token)boot()});
</script></body></html>
